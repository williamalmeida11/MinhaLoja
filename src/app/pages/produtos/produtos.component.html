
    <h1>Produtos</h1>

    <div id="remedios">
        <div class="produto" *ngFor="let produto of produtos">
            <img class="imagem-produto" [src]="produto.imagem" [alt]="produto.nome">
            <h3>{{ produto.nome }}</h3>
            <h4>R$ {{ produto.preco.toFixed(2).replace('.', ',') }}</h4>
            <p>{{ produto.descricao }}</p>
            <button routerLink="/carrinho-compras"><b>Adicionar ao carrinho</b></button>
        </div>
    </div>
