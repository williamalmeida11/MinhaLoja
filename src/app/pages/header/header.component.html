<header class="header">

  <nav class="navbar">
    <div class="navbar-container">

      <div class="navbar-esquerda">

        <a class="navbar-logo" routerLink="/">
          <img src="/imagensLoja/imagemLogo.jpg" alt="Drug Dealers">
        </a>

        <ul class="navbar-list">

          <li class="navbar-item">
            <a routerLink="/">Página Inicial</a>
          </li>

          <li class="navbar-item">
            <a routerLink="/produtos">Produtos</a>
          </li>

          <li class="navbar-item">
            <a routerLink="/carrinho-compras">
              Carrinho de compras
            </a>
          </li>

          <li class="navbar-item">
            <a routerLink="/ajuda">Ajuda</a>
          </li>

        </ul>

      </div>

      <div class="navbar-acoes">

        @if (isAdmin) {
          <a routerLink="/crud">CRUD</a>
        }

        @if (usuarioLogado) {

          <span>Olá, {{ nomeUsuario }}</span>
          <button type="button" (click)="sair()">Sair</button>

        } @else {

          <a routerLink="/cadastro-clientes">
            Cadastre-se
          </a>

          <a routerLink="/login">
            Login
          </a>

        }

      </div>

    </div>
  </nav>

</header>
