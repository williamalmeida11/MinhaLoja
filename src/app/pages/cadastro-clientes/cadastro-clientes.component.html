<div class="pagina-cadastro">
  <div class="cartao-cadastro">
    <h1>Criar conta</h1>
    <p>Preencha os dados abaixo para criar sua conta.</p>

    <form>
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input
          type="text"
          id="nome"
          name="nome"
          placeholder="Digite seu nome completo"
          required
        />
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Digite seu e-mail"
          required
        />
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input
          type="password"
          id="senha"
          name="senha"
          placeholder="Digite sua senha"
          minlength="6"
          required
        />
      </div>

      <div class="campo">
        <label for="confirmarSenha">Confirmar senha</label>
        <input
          type="password"
          id="confirmarSenha"
          name="confirmarSenha"
          placeholder="Confirme sua senha"
          minlength="6"
          required
        />
      </div>

      <div class="termos">
        <input
          type="checkbox"
          id="aceitarTermos"
          name="aceitarTermos"
          required
        />

        <label for="aceitarTermos">
          Aceito os termos de uso e a política de privacidade.
        </label>
      </div>

      <button type="submit">
        Criar conta
      </button>

      <p class="login">
        Já possui uma conta?
        <a routerLink="login">Entrar</a>
      </p>
    </form>
  </div>
</div>
